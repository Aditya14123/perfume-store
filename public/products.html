<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Middle Eastern Perfumes & Attar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>



<body>
  <nav class="navbar">
    <div class="container navbar-container">
      <a href="/" class="navbar-brand">Perfume Store</a>
      <ul class="navbar-nav" id="navMenu">
        <li><a href="/">Home</a></li>
        <li><a href="/products">Products</a></li>
        <li><a href="/how-it-works">How It Works</a></li>
        <li><a href="/delivery-payment">Delivery & Payment</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
      <div class="navbar-actions">
        <button aria-label="User Account" title="Sign In" id="navUserAuthBtn" onclick="openAuthModal()"
          style="background: none; border: none; cursor: pointer; color: var(--text-dark); margin-right: 15px; display: flex; align-items: center;  "><svg
            width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg></button>

        <button class="navbar-search-toggle" id="navSearchToggle" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <button class="navbar-toggle" id="navToggle" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </nav>
  <div class="navbar-overlay" id="navOverlay"></div>
  <div class="nav-search-overlay" id="navSearchOverlay">
    <div class="nav-search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="navSearchInput" placeholder="Search perfumes..." autocomplete="off">
      <button id="navSearchClose" aria-label="Close search">&times;</button>
    </div>
  </div>

  <section class="products-page">
    <div class="container">
      <h1>Our Products</h1>
      <input type="text" id="searchBar" placeholder="Search by name..." class="search-bar">
      <div class="category-tabs">
        <button class="tab-btn active" data-category="all">All</button>
        <button class="tab-btn" data-category="Middle Eastern Perfumes">Middle Eastern Perfumes</button>
        <button class="tab-btn" data-category="Indian Perfumes">Indian Perfumes</button>
        <button class="tab-btn" data-category="Attars">Attars</button>
        <button class="tab-btn" data-category="Deodorants">Deodorants</button>
      </div>

      <div class="filter-bar" style="display: flex; gap: 15px; margin-bottom: 25px; align-items: center; flex-wrap: wrap;">
        <select id="sortPrice" style="width: auto; margin: 0; padding: 10px 20px; border-radius: 30px; font-weight: 500; border: none; background: #1A1A1A; color: #FFF; cursor: pointer; font-family: inherit; font-size: 0.95rem; outline: none; appearance: auto;">
          <option value="default">Sort by: Featured</option>
          <option value="bestselling">Best Selling</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>

        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; font-size: 0.95rem; user-select: none; color: #1A1A1A; background: #EAEAEA; padding: 8px 16px; border-radius: 30px;">
          <input type="checkbox" id="inStockOnly" style="width: 16px; height: 16px; cursor: pointer; accent-color: #1A1A1A; margin: 0;"> In Stock Only
        </label>
      </div>
      <div id="allProducts" class="product-grid"></div>
      <p class="disclaimer">Prices may vary due to stock and import rates. Final price is always confirmed on WhatsApp.
      </p>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Perfume Store. All rights reserved.</p>
    </div>
  </footer>

  <!-- Auth Modal -->
  <div id="authModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 400px; padding: 30px;">
      <span class="close" onclick="closeAuthModal()">&times;</span>
      <h2 id="authModalTitle" style="margin-bottom: 20px;">Sign In</h2>
      <div id="authError"
        style="color: #FF6B6B; font-size: 0.9rem; display: none; margin-bottom: 15px; text-align: center;"></div>

      <form id="authForm">
        <div id="authUsernameGroup" style="display: none; margin-bottom: 15px;">
          <input type="text" id="authUsername" placeholder="Username" class="form-control" autocomplete="username">
        </div>
        <div style="margin-bottom: 15px;">
          <input type="text" id="authEmail" placeholder="Email or Username" class="form-control" required
            autocomplete="email">
        </div>
        <div class="mb-2" style="position: relative; margin-bottom: 20px;">
          <input type="password" id="authPassword" placeholder="Password" class="form-control" required
            autocomplete="current-password" style="padding-right: 40px; margin-bottom: 0;">
          <button type="button" onclick="toggleAuthPassword()" id="authEyeBtn"
            style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; color: #666; display: flex; align-items: center; justify-content: center;">
            <svg id="authEyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-bottom: 15px;" id="authSubmitBtn">Sign In</button>
      </form>
      <div style="text-align: center; font-size: 0.9rem;">
        <span id="authToggleText">Don't have an account?</span>
        <a href="#" onclick="toggleAuthMode(event)" id="authToggleLink"
          style="color: var(--text-dark); font-weight: 600; text-decoration: underline;">Create one</a>
      </div>
    </div>
  </div>

  <script src="/script.js"></script>
</body>

</html>
