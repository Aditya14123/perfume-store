<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Perfume Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div id="loginContainer">
      <h2>Admin Login</h2>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Admin Username" class="form-control mb-2" required autocomplete="username">
        <div class="mb-2" style="position: relative;">
          <input type="password" id="password" placeholder="Admin Password" class="form-control" required autocomplete="current-password" style="padding-right: 40px; margin-bottom: 0;">
          <button type="button" onclick="togglePassword()" id="eyeBtn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; color: #666; display: flex; align-items: center; justify-content: center;" aria-label="Toggle password visibility">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <div id="loginError" style="color: #FF6B6B; font-size: 0.9rem; display: none; text-align: center; margin-bottom: 10px;"></div>
        <button type="submit" class="btn" style="width: 100%;">Login</button>
      </form>
    </div>

    <div id="adminPanel" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center;" class="mt-4 mb-3">
        <h3 style="margin: 0;">Admin Dashboard</h3>
        <button class="btn btn-secondary" onclick="logoutAdmin()" style="padding: 6px 12px; font-size: 0.9rem;">Logout</button>
      </div>

      <div class="admin-controls mb-3">
        <div class="admin-tabs">
          <button id="tab-section-products" class="active" onclick="switchAdminSection('products')">Products</button>
          <button id="tab-section-reviews" onclick="switchAdminSection('reviews')">Store Reviews</button>
        </div>
      </div>

      <div id="section-products">
        <div class="admin-controls mb-3">
          <div class="admin-tabs">
            <button id="tab-full" class="active" onclick="switchAdminTab('full')">Full Manage</button>
            <button id="tab-price" onclick="switchAdminTab('price')">Quick Price</button>
          </div>
          <div style="position: relative; width: 300px; max-width: 100%;">
            <input type="text" id="adminSearch" class="form-control" placeholder="Search products..." oninput="handleAdminSearchInput(event)" autocomplete="off" style="width: 100%; padding-right: 32px;">
            <button type="button" id="adminSearchClear" onclick="clearAdminSearch()" style="display: none; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1.25rem; color: #888; cursor: pointer; line-height: 1; padding: 2px;">&times;</button>
            <div id="adminSearchAutocomplete" class="admin-search-dropdown" style="display: none; position: absolute; top: calc(100% + 6px); right: 0; width: 320px; background: #FFFFFF; border: 1.5px solid #1A1A1A; border-radius: 12px; box-shadow: 0 12px 36px rgba(0,0,0,0.18); z-index: 99999; max-height: 280px; overflow-y: auto; padding: 4px 0;"></div>
          </div>
        </div>
        <button class="btn mb-3" id="addProductBtn" onclick="showAddForm()">Add Product</button>
        <div id="productsList"></div>
      </div>

      <div id="section-reviews" style="display: none;">
        <div id="adminReviewsList"></div>
      </div>
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
