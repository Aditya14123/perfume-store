<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Perfume Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=1.1">
</head>
<body class="admin-body">
  <div class="admin-login-wrapper" id="loginContainer">
    <div class="admin-login-card">
      <div class="admin-login-header">
        <div class="admin-brand-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2>Admin Portal</h2>
        <p>Sign in to manage stock, pricing & store reviews</p>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="admin-input-group">
          <label for="username">Username</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="username" placeholder="Enter admin username" class="admin-control" required autocomplete="username">
          </div>
        </div>

        <div class="admin-input-group">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" placeholder="Enter password" class="admin-control" required autocomplete="current-password">
            <button type="button" onclick="togglePassword()" id="eyeBtn" class="eye-toggle-btn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div id="loginError" class="admin-login-error"></div>

        <button type="submit" class="admin-login-btn">
          <span>Sign In to Dashboard</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>
    </div>
  </div>

    <div id="adminPanel" style="display: none;" class="container">
      <div class="admin-dashboard-header">
        <h3>Admin Dashboard</h3>
        <button class="admin-logout-btn" onclick="logoutAdmin()">Logout</button>
      </div>

      <div class="admin-controls mb-3">
        <div class="admin-tabs">
          <button id="tab-section-products" class="active" onclick="switchAdminSection('products')">Products</button>
          <button id="tab-section-reviews" onclick="switchAdminSection('reviews')">Store Reviews</button>
        </div>
      </div>

      <div id="section-products">
        <div class="admin-controls mb-3">
          <div class="admin-tabs">
            <button id="tab-full" class="active" onclick="switchAdminTab('full')">Full Manage</button>
            <button id="tab-price" onclick="switchAdminTab('price')">Quick Price</button>
          </div>
          <div style="position: relative; width: 300px; max-width: 100%;">
            <input type="text" id="adminSearch" class="form-control" placeholder="Search products..." oninput="handleAdminSearchInput(event)" autocomplete="off" style="width: 100%; padding-right: 32px;">
            <button type="button" id="adminSearchClear" onclick="clearAdminSearch()" style="display: none; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1.25rem; color: #888; cursor: pointer; line-height: 1; padding: 2px;">&times;</button>
            <div id="adminSearchAutocomplete" class="admin-search-dropdown" style="display: none; position: absolute; top: calc(100% + 6px); right: 0; width: 320px; background: #FFFFFF; border: 1.5px solid #1A1A1A; border-radius: 12px; box-shadow: 0 12px 36px rgba(0,0,0,0.18); z-index: 99999; max-height: 280px; overflow-y: auto; padding: 4px 0;"></div>
          </div>
        </div>
        <button class="btn mb-3" id="addProductBtn" onclick="showAddForm()">Add Product</button>
        <div id="productsList"></div>
      </div>

      <div id="section-reviews" style="display: none;">
        <div id="adminReviewsList"></div>
      </div>
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
